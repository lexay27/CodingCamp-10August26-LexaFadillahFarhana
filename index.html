<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Life Dashboard</title>

    <!-- Link to our single CSS file -->
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>

    <!-- ============================================================
         HEADER
         Contains the app title and the light/dark mode toggle button.
         We will build the toggle in Stage 6.
    ============================================================ -->
    <header class="header">
      <h1 class="app-title">Life Dashboard</h1>
      <button class="btn-theme" id="btnTheme">🌙 Dark Mode</button>
    </header>

    <!-- ============================================================
         MAIN CONTENT
         All four sections live inside this container.
    ============================================================ -->
    <main class="main-container">

      <!-- SECTION 1: GREETING
           Shows the current time, date, and a personalized greeting.
           Built in Stage 2. Custom name added in Stage 7.
      -->
      <section class="card" id="sectionGreeting">
        <h2>Greeting</h2>

        <!-- The greeting message: "Good morning, Alex." etc.
             The edit button sits inline next to the text. -->
        <div class="greeting-message-row">
          <p class="greeting-message" id="greetingMessage"></p>
          <button class="btn-name-edit" id="btnNameEdit" title="Change your name">✏️</button>
        </div>

        <!-- Inline name-edit form — hidden by default.
             Shown when the user clicks the ✏️ button. -->
        <div class="greeting-name-form" id="greetingNameForm" style="display:none;">
          <input
            type="text"
            id="nameInput"
            class="name-input"
            placeholder="Enter your name..."
            maxlength="30"
          />
          <button class="btn-primary btn-name-save" id="btnNameSave">Save</button>
          <button class="btn-name-cancel" id="btnNameCancel">Cancel</button>
        </div>

        <!-- The live clock: hours and minutes -->
        <p class="greeting-time" id="greetingTime"></p>

        <!-- The current date: e.g. "Saturday, August 15, 2026" -->
        <p class="greeting-date" id="greetingDate"></p>
      </section>

      <!-- SECTION 2: FOCUS TIMER
           Pomodoro-style countdown timer.
           Built in Stage 4. Custom time added in Stage 8.
      -->
      <section class="card" id="sectionTimer">
        <h2>Focus Timer</h2>

        <!-- The big countdown display: MM:SS -->
        <p class="timer-display" id="timerDisplay">25:00</p>

        <!-- Status label: Idle / Running / Paused / Time's up! -->
        <p class="timer-status" id="timerStatus">Idle</p>

        <!-- Control buttons -->
        <div class="timer-controls">
          <button class="btn-primary" id="btnTimerStart">▶ Start</button>
          <button class="btn-timer-stop" id="btnTimerStop">⏸ Stop</button>
          <button class="btn-timer-reset" id="btnTimerReset">↺ Reset</button>
        </div>

        <!-- Custom duration input — activated in Stage 8. -->
        <div class="timer-custom" id="timerCustom">
          <label for="timerMinutes">Set minutes:</label>
          <input
            type="number"
            id="timerMinutes"
            class="timer-minutes-input"
            min="1"
            max="120"
            value="25"
          />
          <button class="btn-primary" id="btnTimerSet">Set</button>
        </div>
      </section>

      <!-- SECTION 3: TO-DO LIST
           Add, edit, complete, and delete tasks.
           Built in Stage 3.
      -->
      <section class="card" id="sectionTodo">
        <h2>To-Do List</h2>

        <!-- Input row: text field + add button -->
        <div class="todo-input-row">
          <input
            type="text"
            id="todoInput"
            class="todo-input"
            placeholder="Add a new task..."
            maxlength="120"
          />
          <button class="btn-primary" id="btnAddTodo">Add</button>
        </div>

        <!-- The task list is rendered here by JavaScript.
             Each <li> is created dynamically — we never write them by hand. -->
        <ul class="todo-list" id="todoList"></ul>

        <!-- Shown when there are no tasks -->
        <p class="todo-empty" id="todoEmpty">No tasks yet. Add one above!</p>
      </section>

      <!-- SECTION 4: QUICK LINKS
           Save and display favorite website links.
           Built in Stage 5.
      -->
      <section class="card" id="sectionLinks">
        <h2>Quick Links</h2>

        <!-- Two inputs: display name + URL, then an Add button -->
        <div class="links-input-group">
          <input
            type="text"
            id="linkNameInput"
            class="links-input"
            placeholder="Name (e.g. GitHub)"
            maxlength="40"
          />
          <input
            type="url"
            id="linkUrlInput"
            class="links-input"
            placeholder="URL (e.g. https://github.com)"
          />
          <button class="btn-primary" id="btnAddLink">Add</button>
        </div>

        <!-- Links are rendered here as clickable cards -->
        <div class="links-list" id="linksList"></div>

        <!-- Shown when no links are saved -->
        <p class="links-empty" id="linksEmpty">No links yet. Add one above!</p>
      </section>

    </main>

    <!-- Link to our single JavaScript file.
         Placed at the bottom so the HTML loads before JS runs. -->
    <script src="js/app.js"></script>
  </body>
</html>
